[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cms-orchestrator"
version = "0.2.0"
description = "Multi-agent code modernization and security analysis orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.50",
    "langgraph-checkpoint>=2.0.0",
]

[project.optional-dependencies]
# Tree-sitter grammars for the Phase 3 multi-language backend. Kept optional
# so the Phase 1/2 image stays small and wheel-only.
treesitter = [
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.4.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "respx>=0.21.0",
]

# No console-script entry point: `scripts/` is a plain directory, not a
# package, and is deliberately kept out of the wheel. Run the profiler with
# `python scripts/analyze_file.py` from this directory.

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # pytest uses assert
    "B008",  # FastAPI Depends() in defaults is the documented pattern
    # `class X(str, Enum)` over `StrEnum`: Pydantic, FastAPI's OpenAPI
    # generation and `json.dumps` all treat the mixin form as a plain string
    # without a custom encoder. The ergonomics are identical; the interop is not.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "D"]
"app/analysis/security_rules.py" = ["E501"]  # rule text reads better unwrapped

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
disallow_untyped_defs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["langgraph.*"]
ignore_missing_imports = true
